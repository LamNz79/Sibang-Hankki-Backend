name: Backend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Maven test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sibang_hankki_test
          POSTGRES_USER: sibang_test
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sibang_test -d sibang_hankki_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: jdbc:postgresql://127.0.0.1:5432/sibang_hankki_test
      DB_USERNAME: sibang_test
      DB_PASSWORD: ci_password
      BOOKING_SLOT_GENERATION_ENABLED: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test and verify
        run: mvn --batch-mode --no-transfer-progress clean verify
